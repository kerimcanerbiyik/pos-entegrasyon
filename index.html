<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal POS Altyapısı Entegrasyonu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <script>
        // ==========================================
        // 1. MODEL KATMANI (Saf Veri Yapısı)
        // ==========================================
        class OdemeModel {
            constructor(kullaniciAdi, abonelikTipi, tutar) {
                this.kullaniciAdi = kullaniciAdi;
                this.abonelikTipi = abonelikTipi;
                this.tutar = tutar;
            }
        }


        // ==========================================
        // 2. VIEWMODEL KATMANI (İş Mantığı)
        // ==========================================
        class OdemeViewModel {
            constructor() {
                this.isLoading = false;
            }

            async odemeIsleminiGerceklestir(kullaniciAdi, abonelikTipi, tutar) {
                const veri = new OdemeModel(kullaniciAdi, abonelikTipi, tutar);
                this.isLoading = true;

                try {
                    const response = await fetch('/api/abonelik-odeme', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(veri)
                    });

                    const sonuc = await response.json();
                    if (!response.ok) throw new Error(sonuc.error || "Ödeme işlemi başarısız oldu.");

                    return { success: true, message: sonuc.message };
                } catch (err) {
                    return { success: false, message: err.message };
                } finally {
                    this.isLoading = false;
                }
            }
        }
    </script>


    <!-- ========================================== -->
    <!-- 3. VIEW KATMANI & GÖRÜNÜM NESNE BAĞLANTISI -->
    <!-- ========================================== -->
    <div id="odemeGorunumu" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Abonelik Ödeme Ekranı</h1>

        <form id="odemeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Kullanıcı Adı</label>
                <input type="text" id="kullaniciAdi" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Adınızı girin">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Abonelik Tipi</label>
                <select id="abonelikTipi" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Aylık Standart">Aylık Standart Plan</option>
                    <option value="Yıllık Pro">Yıllık Pro Plan</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tutar (TL)</label>
                <input type="number" id="tutar" required value="150" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" id="odemeBtn"
                class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition duration-200">
                Güvenli Ödeme Yap
            </button>
        </form>

        <div id="sonucMesaji" class="mt-4 text-center text-sm font-medium hidden"></div>

        <!-- Matruşka Mantığıyla Görünümü Nesneye Çevirip Tetikleyen Yapı -->
        <script>
            class OdemeViewBinding {
                constructor(containerElement, viewModel) {
                    this.container = containerElement;
                    this.viewModel = viewModel;
                    this.initBindings();
                }

                initBindings() {
                    const form = this.container.querySelector('#odemeForm');
                    const btn = this.container.querySelector('#odemeBtn');
                    const mesajDiv = this.container.querySelector('#sonucMesaji');

                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        
                        const kAdi = this.container.querySelector('#kullaniciAdi').value;
                        const aTipi = this.container.querySelector('#abonelikTipi').value;
                        const tutar = this.container.querySelector('#tutar').value;

                        btn.disabled = true;
                        btn.textContent = "İşlem Yapılıyor...";
                        mesajDiv.classList.add('hidden');

                        const sonuc = await this.viewModel.odemeIsleminiGerceklestir(kAdi, aTipi, tutar);

                        mesajDiv.textContent = sonuc.message;
                        mesajDiv.classList.remove('hidden');
                        mesajDiv.className = `mt-4 text-center text-sm font-medium ${sonuc.success ? 'text-emerald-600' : 'text-rose-600'}`;

                        btn.disabled = false;
                        btn.textContent = "Güvenli Ödeme Yap";
                    });
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                const gorunumElementi = document.getElementById('odemeGorunumu');
                const viewModelInstance = new OdemeViewModel();
                new OdemeViewBinding(gorunumElementi, viewModelInstance);
            });
        </script>
    </div>

</body>
</html>
